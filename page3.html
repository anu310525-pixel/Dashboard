<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript Learning Hub</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #eef2ff;
    color: #1e293b;
}

header {
    background: #312e81;
    color: white;
    padding: 22px;
    text-align: center;
}

.container {
    max-width: 850px;
    margin: 30px auto;
    padding: 15px;
}

.slide {
    background: white;
    padding: 35px 25px;
    min-height: 300px;
    border-radius: 15px;
    box-shadow: 0 5px 15px #00000012;
    text-align: center;
}

.slide h2 {
    color: #4338ca;
}

.slide p {
    line-height: 1.8;
    font-size: 17px;
}

.navigation {
    text-align: center;
    margin: 20px;
}

button {
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #4338ca;
    color: white;
    cursor: pointer;
    margin: 5px;
}

button:hover {
    background: #312e81;
}

button:disabled {
    background: #94a3b8;
    cursor: not-allowed;
}

progress {
    width: 100%;
    height: 18px;
}

.chart {
    margin-top: 20px;
    text-align: left;
}

.bar {
    background: #c7d2fe;
    height: 28px;
    margin: 10px 0;
    border-radius: 5px;
    overflow: hidden;
}

.fill {
    height: 100%;
    background: #4338ca;
    color: white;
    text-align: right;
    padding-right: 8px;
    font-size: 13px;
    line-height: 28px;
}

.quiz-option {
    display: block;
    width: 100%;
    margin: 10px 0;
    background: #e0e7ff;
    color: #1e293b;
    text-align: left;
}

#quizResult {
    font-weight: bold;
    margin: 15px;
}

footer {
    text-align: center;
    padding: 20px;
    color: #64748b;
}

@media(max-width:600px) {
    .slide {
        padding: 25px 15px;
    }
}
</style>
</head>

<body>

<header>
    <h1>💻 JavaScript Learning Hub</h1>
    <p>Interactive Learning Presentation</p>
</header>

<div class="container">

    <progress id="progress" value="1" max="10"></progress>

    <p id="slideNumber" style="text-align:center">
        Slide 1 of 10
    </p>

    <div class="slide" id="slideContent"></div>

    <div class="navigation">
        <button id="previous" onclick="changeSlide(-1)">
            ← Previous
        </button>

        <button id="next" onclick="changeSlide(1)">
            Next →
        </button>
    </div>

</div>

<footer>
    JavaScript Learning Hub | Created using HTML, CSS & JavaScript
</footer>

<script>

const slides = [

{
title: "Welcome to JavaScript",
content: "JavaScript is a programming language used to create interactive and dynamic websites. It works with HTML and CSS."
},

{
title: "What is JavaScript?",
content: "JavaScript is a scripting language that allows websites to respond to user actions, update content and perform calculations."
},

{
title: "Features of JavaScript",
content: "Easy to learn, lightweight, dynamic, event-driven and supported by modern web browsers."
},

{
title: "Variables",
content: "Variables store information. JavaScript uses let, const and var to declare variables."
},

{
title: "Data Types",
content: "Common data types include String, Number, Boolean, Undefined, Null, Object and BigInt."
},

{
title: "Operators",
content: "Operators perform operations. Examples include +, -, *, /, %, == and ===."
},

{
title: "Functions",
content: "Functions are reusable blocks of code that perform specific tasks."
},

{
title: "Conditional Statements",
content: "If, else and switch statements help programs make decisions based on conditions."
},

{
title: "Loops and Applications",
content: "For and while loops repeat tasks. JavaScript is used in websites, web applications and interactive tools."
},

{
title: "Conclusion",
content: "JavaScript makes websites interactive and improves user experience. It is an important language for web development."
}

];

let currentSlide = 0;

function displaySlide() {

    let slide = slides[currentSlide];

    document.getElementById("slideContent").innerHTML =
        "<h2>" + slide.title + "</h2>" +
        "<p>" + slide.content + "</p>" +
        (currentSlide === 8 ? getChart() : "") +
        (currentSlide === 9 ? getQuiz() : "");

    document.getElementById("slideNumber").innerText =
        "Slide " + (currentSlide + 1) + " of " + slides.length;

    document.getElementById("progress").value =
        currentSlide + 1;

    document.getElementById("previous").disabled =
        currentSlide === 0;

    document.getElementById("next").disabled =
        currentSlide === slides.length - 1;
}

function changeSlide(direction) {
    currentSlide += direction;

    if (currentSlide < 0) currentSlide = 0;
    if (currentSlide >= slides.length) {
        currentSlide = slides.length - 1;
    }

    displaySlide();
}

function getChart() {
    return `
    <h3>JavaScript Learning Topics</h3>
    <div class="chart">
        <p>Variables</p>
        <div class="bar"><div class="fill" style="width:85%">85%</div></div>

        <p>Functions</p>
        <div class="bar"><div class="fill" style="width:75%">75%</div></div>

        <p>Loops</p>
        <div class="bar"><div class="fill" style="width:65%">65%</div></div>

        <p>DOM</p>
        <div class="bar"><div class="fill" style="width:90%">90%</div></div>
    </div>`;
}

function getQuiz() {
    return `
    <h3>Quick JavaScript Quiz</h3>
    <p>Which keyword declares a block-scoped variable?</p>

    <button class="quiz-option" onclick="checkQuiz('var')">var</button>
    <button class="quiz-option" onclick="checkQuiz('let')">let</button>
    <button class="quiz-option" onclick="checkQuiz('print')">print</button>

    <p id="quizResult"></p>
    <button onclick="resetQuiz()">Try Again</button>`;
}

function checkQuiz(answer) {
    let result = document.getElementById("quizResult");

    if (answer === "let") {
        result.innerText = "Correct! Well done.";
    } else {
        result.innerText = "Incorrect. Try again!";
    }
}

function resetQuiz() {
    document.getElementById("quizResult").innerText = "";
}

document.addEventListener("keydown", function(event) {
    if (event.key === "ArrowRight") changeSlide(1);
    if (event.key === "ArrowLeft") changeSlide(-1);
});

displaySlide();

</script>

</body>
</html>
